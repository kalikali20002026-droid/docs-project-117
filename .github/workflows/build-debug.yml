name: build-debug
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --noconsole --name Debug_Viewer debug_agent.py
      - uses: actions/upload-artifact@v4
        with:
          name: debug_exe
          path: dist/Debug_Viewer.exe
